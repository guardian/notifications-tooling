# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note: this repo uses Bun, so we use the `bun` package-ecosystem (not `npm`).
# Dependabot reads the single root `bun.lock`, which covers every workspace
# package under src/apps/* and src/packages/*.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps): '
    labels:
      - dependencies
    cooldown:
      default-days: 7
      semver-major-days: 30
      # First-party Guardian packages are trusted; skip the cooldown so their
      # updates (and fixes) land promptly instead of waiting to "stabilise".
      exclude:
        - '@guardian/*'
    ignore:
      # ESLint 10 dropped deprecated context APIs (getFilename/getSourceCode/
      # getScope/getAncestors) that eslint-plugin-react@7.37.5 (via
      # @guardian/eslint-config) still relies on, so `bun lint` crashes.
      # Stay on ESLint 9.x until the Guardian toolchain supports ESLint 10.
      # Still allows 9.x minor/patch updates.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # TypeScript 7 removed the legacy compiler API used by typescript-eslint.
      # Stay on TypeScript 6.x until the Guardian lint toolchain supports 7.x.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Stand's Dialog.Header still uses the title slot removed in React Aria
      # 1.20, which causes every confirmation modal to throw while rendering.
      - dependency-name: react-aria-components
        versions:
          - 1.20.x
    groups:
      all:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: 'chore(deps): '
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ['*']
