name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and upload to riff-raff
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: dispatchdb
      DB_USERNAME: dispatchuser
      DB_PASSWORD: dispatchpw
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dispatchuser
          POSTGRES_PASSWORD: dispatchpw
          POSTGRES_DB: dispatchdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispatchuser -d dispatchdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: '.bun-version'

      - name: Install dependencies
        # Dependabot updates dependencies, which can change the lockfile.
        # Allow it to install without --frozen-lockfile so the updated lockfile can be committed.
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Check pinned dependencies
        run: bun check:pinned-deps

      - name: Check formatting
        run: bun format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun typecheck

      - name: Test
        run: bun run test

      - name: Check migrations
        working-directory: src/packages/database
        run: bun run db:migration:check

      - name: Apply migrations
        working-directory: src/packages/database
        run: bun run db:migration:apply

      - name: Build application
        working-directory: src/apps/backend
        run: bun run build

      - name: Build frontend assets
        working-directory: src/apps/frontend
        run: bun run build

      - name: Build and synth CDK
        working-directory: cdk
        run: bun synth

      - name: Combine application and CDK into dist
        run: |
          mkdir -p dist/frontend
          cp -v src/apps/backend/dist/handler.js dist/
          cp -Rv src/apps/frontend/dist/. dist/frontend/
          cd dist
          zip -r dispatch.zip .

      - name: Upload to riff-raff
        uses: guardian/actions-riff-raff@eecac3ac4f7a446dd59aaa636163c9ae88baf4a4
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          projectName: Editorial Tools::Dispatch
          configPath: cdk/cdk.out/riff-raff.yaml
          contentDirectories: |
            cdk.out:
              - cdk/cdk.out
            dispatch:
              - dist/dispatch.zip

  storybook-tests:
    name: Storybook interaction tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: '.bun-version'

      - name: Install dependencies
        # Dependabot updates dependencies, which can change the lockfile.
        # Allow it to install without --frozen-lockfile so the updated lockfile can be committed.
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Install Playwright browser
        working-directory: src/apps/frontend
        run: bunx playwright install --with-deps chromium

      - name: Run Storybook tests
        working-directory: src/apps/frontend
        run: bun run test-storybook
