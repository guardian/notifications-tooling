<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Notifications Tooling</title>
	</head>
	<body>
		<div id="root"></div>

		<script id="page-config" type="application/json">
			<!--APP_CONFIG-->
		</script>
		<script>
			try {
				window.__APP_CONFIG__ = JSON.parse( document.getElementById("page-config").innerText.trim())
			} catch (err) {
				console.error("could not read page config", err)
				window.__APP_CONFIG__ = {}
			}
		</script>

		<script type="module" src="./frontend.tsx"></script>
	</body>
</html>
